// ==WindhawkMod==
// @id              minecraft-hotbar-win10-fullbar
// @name            Minecraft Hotbar - Windows 10 (fullbar)
// @description     Minecraft-style slots on a transparent Windows 10 taskbar - fullbar variant: buttons stay on the left (experimental)
// @version         0.6.1
// @author          BitRize
// @include         explorer.exe
// @architecture    x86-64
// @compilerOptions -lgdi32 -lshell32 -lmsimg32
