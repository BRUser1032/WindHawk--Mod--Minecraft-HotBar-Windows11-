// ==WindhawkModReadme==
/*
# Minecraft Hotbar - Windows 10 - fullbar (experimental)

Variant "fullbar": the app buttons stay where Windows puts them (left,
next to Start). See also the "splitbar" variant, which centers them.

Makes the Windows 10 taskbar background transparent and draws Minecraft-style
slots behind the taskbar buttons, the Start button, the notification-area
icons and the clock/date. The active window gets a white "selected slot" frame.

## Credits
- The hook point (`CTaskBtnGroup::_DrawBar`) and the render-info layout come
  from the "Classic Taskbar Fix" mod by aubymori
  (https://winclassic.net/thread/1889/classic-taskbar-fix). This is a
  derivative work; the original author keeps credit for the technique.
- Taskbar transparency uses the undocumented `SetWindowCompositionAttribute`
  API, the same approach used by tools such as TranslucentTB.
- The slot colors and frame thickness were measured from a screenshot of the
  author's Windows 11 "Minecraft Hotbar" Taskbar Styler setup (theme by
  WasiXGamer). Colors are approximations.
- Written with AI assistance (Claude).

## Status
- Experimental. Target: Windows 10 22H2 (19045.x).
- Do not run together with "Classic Taskbar Fix" or with the other variant
  (fullbar / splitbar): they use the same hook.

## How the Start / tray / clock frames work
Those are separate windows that this mod cannot paint on directly. A small
click-through helper window is placed just *below* the (transparent) taskbar
and draws the slots there. It hides itself when a full-screen app is running.
Tray icons are narrow on Windows 10 (about 22-25 px each), so neighbouring
icons are grouped until a slot is about as wide as the taskbar is tall. The
language indicator and the clock share one slot, and the notification (bell)
button gets its own. A setting can merge the whole tray into a single slot.

## Recommended taskbar settings
Settings > Personalization > Taskbar > "Combine taskbar buttons":
"Always, hide labels", so each button is icon-only.

## Known limitations
- Only the primary taskbar gets the Start/tray/clock frames.
- Works with the taskbar at the top or bottom of the screen.
- Transparency and helper window are refreshed every 250 ms.
*/
// ==/WindhawkModReadme==

