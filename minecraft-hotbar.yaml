/*
- frameStartButton: true
  $name: Frame around the Start button
- frameTray: true
  $name: Frames around the notification-area icons
- frameClock: true
  $name: Frame around the clock/date
- singleTraySlot: false
  $name: One single slot for the whole tray
  $description: Off = several slots (about 2 icons each). On = chevron, icons, language, clock and notifications all inside one big slot.
- squareAppSlots: false
  $name: Square app slots (with gaps)
  $description: Off = slots touch each other like the real hotbar (but are slightly wider than tall on Windows 10).
*/
